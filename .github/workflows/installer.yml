# Builds "Install OoT Online.app", the Mac installer a player downloads (no Xcode, Homebrew or Terminal on their Mac), and publishes it as a release.
# What it carries (its payload): a standalone Python with the build's Python packages, the parts of the game app that need a compiler (nxnative's Mac
# host with OoT Online's module, the app's launcher, the shader compile tool), built here from nxnative at patches/NXNATIVE_COMMIT with patches/
# applied, and OoT Online's own scripts. Nothing from the game: the player's Mac downloads nxnative's source itself and builds the game from their dump.
#   A tag installer-v1.2.0 (git push origin installer-v1.2.0), or Actions → installer → Run workflow with version 1.2.0, builds and publishes release
#   installer-v1.2.0; a push to the installer branch, or Run workflow without a version, only builds it (an artifact).
name: installer
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0); empty = build only, no release'
        required: false
        default: ''
  push:
    branches: [installer]   # test builds of the installer (an artifact, no release)
    tags: ['installer-v*']  # a release
permissions:
  contents: write
env:
  GAME: '0400486024DEC000'
  XCODE: /Applications/Xcode_27.1.app        # the Xcode the tested game host was built with
  PBS_URL: https://github.com/astral-sh/python-build-standalone/releases/download/20261026/cpython-3.14.10%2B20261026-aarch64-apple-darwin-install_only.tar.gz
  PBS_SHA256: 30a18bcb9ab75e485b4bf4e5d783dde165571e7e42c56dff47a2d2c5345183a4
  PY_PACKAGES: lz4==4.4.5 capstone==5.0.9 fonttools==4.68.0 zbic==1.0.1.post1 zstandard==0.25.0
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          sudo xcode-select -s "$XCODE"
          xcodebuild -version; xcrun --sdk macosx --show-sdk-version; sw_vers
      - name: nxnative at the tested commit, with OoT Online's changes
        run: |
          C=$(cat patches/NXNATIVE_COMMIT)
          curl -fsSL --retry 3 -o nx.tar.gz "https://codeload.github.com/seedds/nxnative/tar.gz/$C"
          mkdir nx && tar -xzf nx.tar.gz -C nx --strip-components 1
          for p in nxnative-mac26-translator nxnative-xcode27.1-blend-ref nxnative-frame-step-gpu-span nxnative-no-xcode; do
            patch -p1 --batch --forward -s -d nx -i "$PWD/patches/$p.patch"
          done
          python3 -I tools/integrate_nxnative.py nx
      - name: The game host, the app's launcher and the shader compile tool
        run: DM_SOURCE_COMMIT="$(cut -c1-12 patches/NXNATIVE_COMMIT)+oot-online" python3 nx/dm/mac/prebuild.py "$GAME" payload/prebuilt
      - name: Python and its packages
        run: |
          curl -fsSL --retry 3 -o pbs.tar.gz "$PBS_URL"
          echo "$PBS_SHA256  pbs.tar.gz" | shasum -a 256 -c
          tar -xzf pbs.tar.gz -C payload
          payload/python/bin/python3 -m pip install --disable-pip-version-check --no-warn-script-location --only-binary=:all: $PY_PACKAGES
          payload/python/bin/python3 -I -c "import lz4.block, capstone, fontTools, zbic, zstandard, sqlite3, ctypes, compression.zstd; assert capstone.cs_version()[0] == 5; print('python ok')"
          payload/python/bin/python3 -m pip download --disable-pip-version-check --no-deps --no-binary=:all: zbic==1.0.1.post1 -d payload/licenses/zbic-source
          rm -rf payload/python/lib/python3.14/site-packages/pip* payload/python/bin/pip*
          find payload/python -name __pycache__ -prune -exec rm -rf {} +
      - name: OoT Online's scripts and the licenses
        run: |
          mkdir -p payload/oot-online payload/licenses/nxnative
          cp -R patches tools client setup payload/oot-online/
          cp docs/server.txt payload/oot-online/server.txt   # the public server, for when the website cannot be reached at install time
          cp nx/LICENSE payload/licenses/nxnative/LICENSE
          for d in nx/dm/third_party/*/; do n=$(basename "$d"); for f in "$d"LICENSE* "$d"COPYING*; do [ -f "$f" ] && mkdir -p "payload/licenses/nxnative/$n" && cp "$f" "payload/licenses/nxnative/$n/"; done; done
          cat > payload/licenses/README.txt <<'EOF'
          What this installer carries, and their licenses:
          - prebuilt/: nxnative's Mac host with OoT Online's module, the app's launcher and dmsh_rtc, compiled from nxnative (MIT, nxnative/LICENSE;
            https://github.com/seedds/nxnative) with OoT Online's changes (https://github.com/bhoneka/oot-online). The host includes libvpx, dav1d and
            stb_vorbis (their licenses in nxnative/).
          - python/: CPython (PSF license, python/lib/python3.14/LICENSE.txt) from python-build-standalone, with lz4 (BSD), capstone (BSD), fonttools (MIT)
            zstandard (BSD) and zbic (GPLv2: its complete source is in zbic-source/; https://github.com/kinnay/zbic). Each package's license is in its
            .dist-info folder.
          Nothing in this installer comes from the game.
          EOF
      - name: The installer app
        run: |
          V="${{ inputs.version }}"; [[ -n "$V" || "$GITHUB_REF" != refs/tags/installer-v* ]] || V="${GITHUB_REF#refs/tags/installer-v}"
          [ -n "$V" ] || V="0.0.0-${GITHUB_SHA::7}"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          zsh installer/build_app.sh payload dist "$V"
          ditto -c -k --keepParent "dist/Install OoT Online.app" "dist/Install-OoT-Online.zip"
          ls -la dist
      - name: Checks
        run: |
          A="dist/Install OoT Online.app/Contents/Resources/payload"
          codesign --verify --strict "dist/Install OoT Online.app"
          for f in dmhost launcher dmsh_rtc; do file "$A/prebuilt/$f" | grep -q arm64; done
          python3 -c "import json; m = json.load(open('$A/prebuilt/manifest.json')); print('chain', m['chain'], 'minos', m['minos'], 'sdk', m['sdk'])"
          "$A/prebuilt/dmsh_rtc" --version || echo "(no Metal compiler on this runner: not checked here)"
          ! grep -rIl "/Users/" "$A/oot-online" "$A/prebuilt/manifest.json"   # no local paths in what the installer carries
      - uses: actions/upload-artifact@v4
        with:
          name: Install-OoT-Online
          path: dist/Install-OoT-Online.zip
      - name: Release
        if: inputs.version != '' || startsWith(github.ref, 'refs/tags/installer-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "installer-v$VERSION" dist/Install-OoT-Online.zip --target "$GITHUB_SHA" --latest \
            --title "OoT Online installer $VERSION" \
            --notes "Download **Install-OoT-Online.zip**, open it, and open **Install OoT Online**. The first time, macOS says it cannot check the app: open **System Settings → Privacy & Security** and click **Open Anyway**. Then choose your own game file (a .nup). No Xcode, Homebrew or Terminal needed. Built from $(git rev-parse --short HEAD) with nxnative $(cut -c1-12 patches/NXNATIVE_COMMIT)."
